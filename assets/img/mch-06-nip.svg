<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Nip rolls flattening the tube">
<defs>
  <marker id="arN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#D9743C"/>
  </marker>
  <marker id="adN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#75929C"/>
  </marker>
  <linearGradient id="mtN" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D9743C" stop-opacity=".85"/><stop offset="1" stop-color="#E8C08A" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="stN" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1B3A45"/><stop offset="0.5" stop-color="#102630"/><stop offset="1" stop-color="#0A1B23"/>
  </linearGradient>
  <radialGradient id="hgN" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D9743C" stop-opacity=".30"/><stop offset="1" stop-color="#D9743C" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="640" height="400" fill="#071419"/>
<g stroke="#12303A" stroke-width="1" opacity=".8">
  <path d="M0 80H640M0 160H640M0 240H640M0 320H640"/>
  <path d="M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
</g>

<!-- converging film -->
<path d="M60 96 C 160 96, 210 150, 254 176" fill="none" stroke="#D9743C" stroke-width="2.6"/>
<path d="M60 314 C 160 314, 210 260, 254 234" fill="none" stroke="#D9743C" stroke-width="2.6"/>
<path d="M60 96 C 160 96, 210 150, 254 176 L254 234 C 210 260, 160 314, 60 314 Z" fill="url(#hgN)" opacity=".8"/>
<!-- nip rolls -->
<circle cx="300" cy="118" r="62" fill="url(#stN)" stroke="#EDF6F7" stroke-width="1.8"/>
<circle cx="300" cy="118" r="40" fill="none" stroke="#75929C" stroke-width="1.1" opacity=".6"/>
<circle cx="300" cy="118" r="8" fill="#A7BFC5"/>
<circle cx="300" cy="292" r="62" fill="url(#stN)" stroke="#EDF6F7" stroke-width="1.8"/>
<circle cx="300" cy="292" r="40" fill="none" stroke="#75929C" stroke-width="1.1" opacity=".6"/>
<circle cx="300" cy="292" r="8" fill="#A7BFC5"/>
<!-- rotation -->
<path d="M300 68 a50 50 0 0 1 44 26" fill="none" stroke="#D9743C" stroke-width="1.6" marker-end="url(#arN)"/>
<path d="M300 342 a50 50 0 0 0 44 -26" fill="none" stroke="#D9743C" stroke-width="1.6" marker-end="url(#arN)"/>
<!-- pressure -->
<path d="M300 32v22" stroke="#A7BFC5" stroke-width="1.6" marker-end="url(#adN)"/>
<path d="M300 378v-22" stroke="#A7BFC5" stroke-width="1.6" marker-end="url(#adN)"/>
<text x="316" y="30" font-family="monospace" font-size="10" letter-spacing="1.5" text-anchor="start" fill="#A7BFC5">NIP PRESSURE</text>
<!-- flat film out -->
<rect x="362" y="198" width="222" height="14" fill="#D9743C" opacity=".35" stroke="#D9743C" stroke-width="1.8"/>
<path d="M560 205h32" stroke="#D9743C" stroke-width="1.6" marker-end="url(#arN)"/>
<text x="362" y="182" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="start" fill="#D9743C">TWO WALLS · TWO FOLDED EDGES</text>
<text x="362" y="238" font-family="monospace" font-size="9.5" letter-spacing="1.5" text-anchor="start" fill="#EDF6F7">THE STEP THAT MAKES IT</text>
<text x="362" y="254" font-family="monospace" font-size="9.5" letter-spacing="1.5" text-anchor="start" fill="#EDF6F7">'LAY FLAT'</text>
<text x="362" y="276" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="start" fill="#75929C">AIR EXPELLED · NO SEAM</text>
<text x="362" y="290" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="start" fill="#75929C">WIDTH LOCKED</text>
<text x="40" y="74" font-family="monospace" font-size="10" letter-spacing="1.5" text-anchor="start" fill="#EDF6F7">ROUND TUBE</text>

<text x="624" y="386" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="end" fill="#75929C">NIP ROLLS FLATTENING THE TUBE</text>
</svg>
